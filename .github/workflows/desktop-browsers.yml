name: Windows and Mint browser UI tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-browsers:
    # Native Windows browsers; Server 2025 is not Windows 11 desktop acceptance.
    runs-on: windows-2025
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [msedge, firefox, chrome]
    env:
      PCC_DESKTOP_TARGET: windows
      PCC_DESKTOP_BROWSER: ${{ matrix.browser }}
      SE_AVOID_STATS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install UI fixture tools only
        run: python -m pip install 'selenium>=4.27,<5' 'cryptography>=44'
      - name: Test installed retail browser and actual panel UI
        run: python tests/desktop_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-windows-${{ matrix.browser }}
          path: dist/browser-screenshots/desktop-windows-${{ matrix.browser }}/
          if-no-files-found: ignore
          retention-days: 14
  mint-browsers:
    # Mint userspace on shared Linux kernel, not a full Mint Xfce VM/session.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, chrome, opera]
    steps:
      - uses: actions/checkout@v4
      - name: Build disposable Mint browser-test environment
        run: docker build -f tests/mint/Dockerfile -t pcc-mint-browser-test .
      - name: Test retail browser inside Mint userspace
        env:
          PCC_DESKTOP_BROWSER: ${{ matrix.browser }}
        run: |
          script=tests/desktop_e2e.py
          if [ "$PCC_DESKTOP_BROWSER" = opera ]; then script=tests/opera_e2e.py; fi
          docker create --name pcc-mint-ui --shm-size=1g -e PCC_DESKTOP_BROWSER -e SE_AVOID_STATS=true pcc-mint-browser-test python "$script"
          docker start -a pcc-mint-ui
          status=$(docker inspect --format '{{.State.ExitCode}}' pcc-mint-ui)
          exit "$status"
      - name: Collect evidence and remove only the test container
        if: always()
        run: |
          mkdir -p dist/browser-screenshots
          docker cp pcc-mint-ui:/work/dist/browser-screenshots/. dist/browser-screenshots/ || true
          docker rm -f pcc-mint-ui || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-mint-${{ matrix.browser }}
          path: dist/browser-screenshots/desktop-mint-${{ matrix.browser }}/
          if-no-files-found: ignore
          retention-days: 14

  opera-native:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            target: windows
          - os: macos-26
            target: macos
    runs-on: ${{ matrix.os }}
    env:
      PCC_DESKTOP_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Opera on disposable Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            choco install opera --yes --no-progress
            python -c "import sys; sys.path.insert(0, 'tests'); from retail_opera import opera_binary; print(opera_binary())"
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds 5 }
          }
          throw 'Retail Opera installation could not be verified on this disposable runner.' 
      - name: Install Opera on disposable macOS runner
        if: runner.os == 'macOS'
        run: brew install --cask opera
      - name: Install test tools without substituting a browser
        run: python -m pip install 'playwright>=1.56,<2' 'cryptography>=44'
      - name: Test actual Opera panels and execution dialogs
        run: python tests/opera_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-${{ matrix.target }}-opera
          path: dist/browser-screenshots/desktop-${{ matrix.target }}-opera/
          if-no-files-found: ignore
          retention-days: 14
