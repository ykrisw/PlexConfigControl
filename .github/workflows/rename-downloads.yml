name: Rename verified 1.6 downloads
on:
  push:
    branches: [main]
    paths: [.github/workflows/rename-downloads.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify packages and update download names and descriptions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 QNAP/build/rename_release_assets.py
