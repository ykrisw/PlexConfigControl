name: QNAP 1.6 installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qnap-installer.yml
      - QNAP/**
defaults:
  run:
    working-directory: QNAP
permissions:
  contents: read
concurrency:
  group: qnap-installer-1.6
  cancel-in-progress: true
jobs:
  notice-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare native QNAP frontend test tools
        run: |
          python -m pip install 'playwright>=1.56,<2' CairoSVG==2.8.2
          python -m playwright install --with-deps '${{ matrix.browser }}'
          python build/prepare_release.py .qnap-notice/source
          PCC_QNAP_SOURCE="$PWD/.qnap-notice/source" python -m unittest discover -s tests -p test_runtime_fixes.py -v
          PCC_QNAP_SOURCE="$PWD/.qnap-notice/source" node --test tests/test_restore_selection.mjs
      - name: Verify the QNAP sign-in notice through the real dialog
        env:
          PCC_STATIC: .qnap-notice/source/plexconfigcontrol/static
          PCC_TEST_BROWSER: ${{ matrix.browser }}
        run: |
          python tests/qnap_login_notice_e2e.py
          python tests/qnap_archives_e2e.py
          PCC_PLATFORM=qnap python ../TrueNAS/tests/visual_refresh_preview_e2e.py
  build:
    if: github.event_name != 'push' || (!startsWith(github.event.head_commit.message, 'rename-only:') && !startsWith(github.event.head_commit.message, 'publish-only:'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare verified QNAP source and shared UI
        run: |
          python -m pip install CairoSVG==2.8.2
          python build/prepare_release.py .qnap-build/source
          cp build/qpkg/qpkg.cfg build/qpkg/package_routines .qnap-build/source/deploy/qnap/qpkg/
          bash -n .qnap-build/source/deploy/qnap/qpkg/package_routines
          bash -n .qnap-build/source/deploy/qnap/qpkg/PCC.sh
      - name: Fetch pinned runtime and QDK
        run: |
          python - <<'PY'
          import pathlib, json, urllib.request, hashlib, subprocess
          root = pathlib.Path(".qnap-build")
          info = json.loads((root/"source/source-provenance.json").read_text())
          assert info["qdk_commit"] == "b7b5f4c86ebe95b10a62d64725515e7cdcf4bb35"
          runtime = root/"python.tar.gz"
          urllib.request.urlretrieve(info["python"]["url"], runtime)
          assert hashlib.sha256(runtime.read_bytes()).hexdigest() == info["python"]["sha256"]
          subprocess.run(["git","clone","https://github.com/qnap-dev/QDK.git",str(root/"qdk")],check=True)
          subprocess.run(["git","-C",str(root/"qdk"),"checkout","--detach",info["qdk_commit"]],check=True)
          PY
      - name: Build locked private dependencies
        run: python build/build_dependencies.py --output .qnap-build/lib --smoke-test
      - name: Build and verify native QPKG
        run: |
          python .qnap-build/source/deploy/qnap/build_qpkg_preview.py --python-archive .qnap-build/python.tar.gz --dependencies .qnap-build/lib --qdk .qnap-build/qdk --private-tar .qnap-build/source/qnap-private-tar --output .qnap-build/output
          python - <<'PY'
          import tarfile
          with tarfile.open(".qnap-build/output/verified-qpkg/data.tar.gz") as archive:
              names = archive.getnames()
              for name in (".qpkg_icon.gif", ".qpkg_icon_80.gif", ".qpkg_icon_gray.gif",
                           "app/plexconfigcontrol/static/archive-refresh.mjs"):
                  assert "./" + name in names, name
          from pathlib import Path
          cfg = Path(".qnap-build/output/verified-qpkg/qpkg.cfg").read_text()
          assert 'QPKG_VER="1.6"' in cfg
          assert 'QPKG_AUTHOR="Krzysztof Wojciechowski"' in cfg
          assert 'Plex configuration backup and restore with data verification.' in cfg
          with tarfile.open(".qnap-build/output/verified-qpkg/data.tar.gz") as archive:
              settings = archive.extractfile("./app/plexconfigcontrol/static/settings-view.mjs").read().decode()
              assert "'[data-version]':'1.6'" in settings
          print("QNAP version 1.6, publisher, summary, icons and refresh asset: OK")
          PY
          mkdir -p qnap-release
          cp .qnap-build/output/release/PCC_1.6_x86_64.qpkg qnap-release/PlexConfigControl_QuTShero_x86-64v1.6.qpkg
          cp .qnap-build/output/release/build-result.json qnap-release/
          cp .qnap-build/source/deploy/qnap/qpkg/icons/PCC_80.png qnap-release/PlexConfigControl_80.png
          python build/make_repository.py qnap-release/PlexConfigControl_QuTShero_x86-64v1.6.qpkg qnap-release/qnap-repository.xml en
          python build/make_repository.py qnap-release/PlexConfigControl_QuTShero_x86-64v1.6.qpkg qnap-release/qnap-repository-pl.xml pl
          cd qnap-release
          sha256sum PlexConfigControl_QuTShero_x86-64v1.6.qpkg > SHA256SUMS_QNAP
      - name: Verify fresh install using the actual packaged server and service UID
        run: sudo --preserve-env=GITHUB_ACTIONS "$(command -v python)" tests/packaged_install_e2e.py qnap-release/PlexConfigControl_QuTShero_x86-64v1.6.qpkg
      - name: Retain source and built installer
        uses: actions/upload-artifact@v4
        with:
          name: PCC-QNAP-1.6-x86_64
          path: QNAP/qnap-release/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: [build, notice-ui]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: PCC-QNAP-1.6-x86_64
          path: QNAP/qnap-release
      - name: Publish verified QNAP 1.6 package and App Center metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 publish_release.py qnap-release
