name: QNAP 1.0.5 installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/qnap-installer.yml
      - deploy/qnap/prepare_release.py
      - deploy/qnap/qpkg/**
      - plexconfigcontrol/static/panel-app.css
      - plexconfigcontrol/static/panel-layout.css
      - plexconfigcontrol/static/**
permissions:
  contents: read
concurrency:
  group: qnap-installer-1.0.5
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'rename-only:')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare verified QNAP source and shared UI
        run: |
          python -m pip install CairoSVG==2.8.2
          python deploy/qnap/prepare_release.py .qnap-build/source
          cp deploy/qnap/qpkg/qpkg.cfg deploy/qnap/qpkg/package_routines .qnap-build/source/deploy/qnap/qpkg/
          bash -n .qnap-build/source/deploy/qnap/qpkg/package_routines
          bash -n .qnap-build/source/deploy/qnap/qpkg/PCC.sh
      - name: Fetch pinned runtime and QDK
        run: |
          python - <<'PY'
          import pathlib, json, urllib.request, hashlib, subprocess
          root = pathlib.Path(".qnap-build")
          info = json.loads((root/"source/source-provenance.json").read_text())
          assert info["qdk_commit"] == "b7b5f4c86ebe95b10a62d64725515e7cdcf4bb35"
          runtime = root/"python.tar.gz"
          urllib.request.urlretrieve(info["python"]["url"], runtime)
          assert hashlib.sha256(runtime.read_bytes()).hexdigest() == info["python"]["sha256"]
          subprocess.run(["git","clone","https://github.com/qnap-dev/QDK.git",str(root/"qdk")],check=True)
          subprocess.run(["git","-C",str(root/"qdk"),"checkout","--detach",info["qdk_commit"]],check=True)
          PY
      - name: Build locked private dependencies
        run: python deploy/qnap/build_dependencies.py --output .qnap-build/lib --smoke-test
      - name: Build and verify native QPKG
        run: |
          python .qnap-build/source/deploy/qnap/build_qpkg_preview.py --python-archive .qnap-build/python.tar.gz --dependencies .qnap-build/lib --qdk .qnap-build/qdk --private-tar .qnap-build/source/qnap-private-tar --output .qnap-build/output
          python - <<'PY'
          import tarfile
          with tarfile.open(".qnap-build/output/verified-qpkg/data.tar.gz") as archive:
              names = archive.getnames()
              for name in (".qpkg_icon.gif", ".qpkg_icon_80.gif", ".qpkg_icon_gray.gif",
                           "app/plexconfigcontrol/static/archive-refresh.mjs"):
                  assert "./" + name in names, name
          print("QNAP App Center icons and shared archive refresh asset: OK")
          PY
          mkdir -p qnap-release
          cp .qnap-build/output/release/PCC_1.0.5_x86_64.qpkg qnap-release/PlexConfigControlQuTShero_1.6.qpkg
          cp .qnap-build/output/release/build-result.json qnap-release/
          cd qnap-release
          sha256sum PlexConfigControlQuTShero_1.6.qpkg > SHA256SUMS_QNAP
      - name: Retain source and built installer
        uses: actions/upload-artifact@v4
        with:
          name: PCC-QNAP-1.0.5-x86_64
          path: qnap-release/
          retention-days: 90
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PCC-QNAP-1.0.5-x86_64
          path: qnap-release
      - name: Publish QNAP installer to the existing 1.0.5 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view v1.0.5 --json body --jq .body > release-notes.txt
          python3 - <<'PY'
          from pathlib import Path
          notes = Path("release-notes.txt")
          body = notes.read_text()
          heading = "## QNAP QuTS hero — x86_64"
          if heading in body:
              body = body.split(heading)[0].rstrip()
          body += "\n\n" + heading + "\n\n"
          body += "PlexConfigControl 1.0.5 — native QNAP installer, separate from the TrueNAS SCALE installer above.\n\n"
          body += "[Download PlexConfigControlQuTShero_1.6.qpkg](https://github.com/ykrisw/PlexConfigControl/releases/download/v1.0.5/PlexConfigControlQuTShero_1.6.qpkg)\n\n"
          body += "For QuTS hero with ZFS snapshot APIs on x86_64; ARM and plain QTS are not supported by this build. Package-private Python and GNU tar are included. Uses the NAS host address and selected HTTPS port; no fixed user IP.\n\n"
          body += "Includes the 20% wider yellow shield and App Center icon, identical archive heading/helper typography, slower desktop-only indeterminate progress motion, synchronized Backup/Restore manual Refresh, compact cards, preserved sign-in fields, touch landscape scrolling and QNAP account-button spacing. Restore waits for manual Plex stop. A successful build does not replace a device-level restore test.\n\n"
          body += "Checksum: SHA256SUMS_QNAP. This QPKG is not digitally signed by QNAP.\n"
          notes.write_text(body)
          PY
          gh release upload v1.0.5 qnap-release/PlexConfigControlQuTShero_1.6.qpkg qnap-release/SHA256SUMS_QNAP --clobber
          gh release edit v1.0.5 --title "PlexConfigControl 1.0.5 — TrueNAS SCALE / QNAP QuTS hero" --notes-file release-notes.txt
