name: QNAP source verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/qnap-source-inspect.yml, PCC_QNAP_Source_1.0.5.zip]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify source bundle and inspect build inputs
        run: |
          python3 - <<'PY'
          import hashlib, zipfile, pathlib, stat
          p = pathlib.Path("PCC_QNAP_Source_1.0.5.zip")
          assert hashlib.sha256(p.read_bytes()).hexdigest() == "6d71dd5161101fcc8dba84c9ec6181ffa50ac2ff9e66678c18653d48a233b0e9"
          with zipfile.ZipFile(p) as z:
              assert len(z.infolist()) == 122
              for i in z.infolist():
                  path = pathlib.PurePosixPath(i.filename)
                  assert not path.is_absolute() and ".." not in path.parts
                  assert not stat.S_ISLNK(i.external_attr >> 16)
                  assert path.parts[0] in {"plexconfigcontrol","deploy","qnap-private-tar","LICENSE","source-provenance.json"}
                  print("SOURCE", i.filename, i.file_size)
              for name in ["deploy/qnap/build_qpkg_preview.py","deploy/qnap/qpkg/PCC.sh","source-provenance.json"]:
                  print("\nBEGIN",name)
                  print(z.read(name).decode())
                  print("END",name)
          print("SOURCE_SHA256_OK")
          PY
