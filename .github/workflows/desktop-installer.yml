name: Native desktop installer
on:
  push:
    branches: ['work/full-click', main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install 'playwright>=1.56,<2'
          python -m playwright install --with-deps '${{ matrix.browser }}'
      - name: Verify Backup and Restore on desktop and mobile layouts
        env:
          PCC_TEST_BROWSER: ${{ matrix.browser }}
        run: |
          python tests/execution_ui_e2e.py
          python tests/mobile_archives_e2e.py
          python tests/mobile_login_landscape_e2e.py
          python tests/visual_refresh_preview_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-layout-${{ matrix.browser }}
          path: dist/browser-screenshots/
          retention-days: 7
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        run: python -m pip install -r deploy/desktop/requirements.txt
      - name: Verify setup protocol and transport
        run: |
          python -m unittest discover -s tests -p test_setup_protocol.py
          python -m unittest discover -s tests -p test_desktop_setup.py
      - name: Build native installer
        run: python deploy/desktop/build.py dist
      - name: Check graphical wizard on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a './dist/PlexConfigControl Setup' --self-test
      - name: Check graphical wizard on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/PlexConfigControl Setup.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop self-test failed with $($process.ExitCode)" }
      - name: Check graphical wizard on macOS
        if: startsWith(matrix.platform, 'macos')
        run: |
          './dist/PlexConfigControl Setup.app/Contents/MacOS/PlexConfigControl Setup' --self-test
      - name: Archive executable permissions
        shell: bash
        run: tar -czf '${{ matrix.platform }}.tar.gz' -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: '${{ matrix.platform }}.tar.gz'
          compression-level: 0
          retention-days: 14
  package:
    needs: [build, backup-layout]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Package all platforms in one ZIP
        run: python deploy/desktop/package.py artifacts release
      - uses: actions/upload-artifact@v4
        with:
          name: PlexConfigControl-Desktop-PL-EN
          path: release/*
          compression-level: 0
          retention-days: 30
  publish:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlexConfigControl-Desktop-PL-EN
          path: release
      - name: Publish the current installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<'RELEASE_NOTES'
          PlexConfigControl 1.0.5 — installer for TrueNAS SCALE.

          One ZIP contains graphical launchers for Windows x64, macOS Apple Silicon and Linux x64. The application is installed on TrueNAS SCALE. Choose English or Polish in the wizard. Existing TrueNAS installations can be updated with the same installer.

          This release makes Backup and Restore action cards shorter, moves explanatory text beside headings, moves Restore Refresh into the archive-list heading, expands the space for archive lists, and equalizes Dashboard account-button spacing. Light and dark themes are retained.

          The current build also widens the shield horizontally by 20%, matches the archive heading and helper typography, slows indeterminate progress motion only on desktop, synchronizes manual Backup/Restore archive refresh and installs the yellow shield as the TrueNAS Apps icon.

          QNAP / QuTS hero uses a separate PCC_1.0.5_x86_64.qpkg installer; do not install this desktop ZIP on QNAP.
          RELEASE_NOTES
          gh release view v1.0.5 --json body > existing-notes.json || printf '{}' > existing-notes.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          previous = json.loads(Path("existing-notes.json").read_text()).get("body", "")
          marker = "## QNAP QuTS hero — x86_64"
          if marker in previous:
              notes = Path("notes.md")
              notes.write_text(notes.read_text() + "\n" + marker + previous.split(marker, 1)[1])
          PY
          if gh release view v1.0.5 >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs/tags/v1.0.5" --method PATCH -f sha="$GITHUB_SHA" -F force=true
            gh release upload v1.0.5 release/* --clobber
            gh release edit v1.0.5 --title 'PlexConfigControl 1.0.5 — TrueNAS SCALE / QNAP QuTS hero' --notes-file notes.md --latest
          else
            gh release create v1.0.5 release/* --target "$GITHUB_SHA" --title 'PlexConfigControl 1.0.5 — TrueNAS SCALE / QNAP QuTS hero' --notes-file notes.md --latest
          fi
