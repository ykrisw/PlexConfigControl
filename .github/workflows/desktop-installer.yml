name: Native desktop installer
on:
  push:
    branches: ['work/full-click', main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup-layout:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser verification tools
        run: |
          python -m pip install 'playwright>=1.56,<2'
          python -m playwright install --with-deps '${{ matrix.browser }}'
      - name: Verify Backup and Restore on desktop and mobile layouts
        env:
          PCC_TEST_BROWSER: ${{ matrix.browser }}
        run: |
          python tests/execution_ui_e2e.py
          python tests/mobile_archives_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backup-layout-${{ matrix.browser }}
          path: dist/browser-screenshots/
          retention-days: 7
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        run: python -m pip install -r deploy/desktop/requirements.txt
      - name: Verify setup protocol and transport
        run: |
          python -m unittest discover -s tests -p test_setup_protocol.py
          python -m unittest discover -s tests -p test_desktop_setup.py
      - name: Build native installer
        run: python deploy/desktop/build.py dist
      - name: Check graphical wizard on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a './dist/PlexConfigControl Setup' --self-test
      - name: Check graphical wizard on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/PlexConfigControl Setup.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop self-test failed with $($process.ExitCode)" }
      - name: Check graphical wizard on macOS
        if: startsWith(matrix.platform, 'macos')
        run: |
          './dist/PlexConfigControl Setup.app/Contents/MacOS/PlexConfigControl Setup' --self-test
      - name: Archive executable permissions
        shell: bash
        run: tar -czf '${{ matrix.platform }}.tar.gz' -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: '${{ matrix.platform }}.tar.gz'
          compression-level: 0
          retention-days: 14
  package:
    needs: [build, backup-layout]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Package all platforms in one ZIP
        run: python deploy/desktop/package.py artifacts release
      - uses: actions/upload-artifact@v4
        with:
          name: PlexConfigControl-Desktop-PL-EN
          path: release/*
          compression-level: 0
          retention-days: 30
  publish:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PlexConfigControl-Desktop-PL-EN
          path: release
      - name: Publish the current installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' 'One installer ZIP for Windows x64, macOS Apple Silicon and Linux x64. Choose English or Polish in the graphical wizard. Both guides are included.' '' 'Matching mobile page scrolling for Backup, Restore and History, with more visible list space. Existing installations can be updated with this installer.' > notes.md
          if gh release view v1.0.10 >/dev/null 2>&1; then
            gh api "repos/$GH_REPO/git/refs/tags/v1.0.10" --method PATCH -f sha="$GITHUB_SHA" -F force=true
            gh release upload v1.0.10 release/* --clobber
            gh release edit v1.0.10 --title 'PlexConfigControl 1.0.10 — Installer PL / EN' --notes-file notes.md --latest
          else
            gh release create v1.0.10 release/* --target "$GITHUB_SHA" --title 'PlexConfigControl 1.0.10 — Installer PL / EN' --notes-file notes.md --latest
          fi
