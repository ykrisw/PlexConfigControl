name: Native desktop installer
on:
  push:
    branches: ['work/full-click']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop build dependencies
        run: python -m pip install -r deploy/desktop/requirements.txt
      - name: Verify setup protocol and transport
        run: |
          python -m unittest discover -s tests -p test_setup_protocol.py
          python -m unittest discover -s tests -p test_desktop_setup.py
      - name: Build native installer
        run: python deploy/desktop/build.py dist
      - name: Check graphical wizard on Linux
        if: matrix.platform == 'linux'
        run: xvfb-run -a './dist/PlexConfigControl Setup' --self-test
      - name: Check graphical wizard on Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/PlexConfigControl Setup.exe' -ArgumentList '--self-test' -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Desktop self-test failed with $($process.ExitCode)" }
      - name: Check graphical wizard on macOS
        if: startsWith(matrix.platform, 'macos')
        run: |
          './dist/PlexConfigControl Setup.app/Contents/MacOS/PlexConfigControl Setup' --self-test
      - name: Archive executable permissions
        shell: bash
        run: tar -czf '${{ matrix.platform }}.tar.gz' -C dist .
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: '${{ matrix.platform }}.tar.gz'
          compression-level: 0
          retention-days: 14
  package:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: artifacts
          merge-multiple: true
      - name: Package all platforms in one ZIP
        run: python deploy/desktop/package.py artifacts release
      - uses: actions/upload-artifact@v4
        with:
          name: PlexConfigControl-Desktop-PL-EN
          path: release/*
          compression-level: 0
          retention-days: 30
