name: Build test installation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install '.[server]'
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/browser/*.mjs
      - name: Build unprivileged test image
        run: docker build --tag plexconfigcontrol:test .
      - name: Test image over HTTPS and restart
        run: python tests/container_smoke.py
      - name: Install disposable browser-test tools
        run: |
          python -m pip install '.[browser-tests]'
          python -m playwright install --with-deps chromium firefox
      - name: Test real Chromium interface
        run: python tests/browser_e2e.py
      - name: Test real Firefox interface
        env:
          PCC_TEST_BROWSER: firefox
        run: python tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlexConfigControl-browser-screenshots
          path: dist/browser-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package test installation
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          docker save plexconfigcontrol:test | gzip > dist/PlexConfigControl-test-image.tar.gz
          cp deploy/TEST-INSTALL.md dist/TEST-INSTALL.md
          cp deploy/TEST-INSTALL-PL.md dist/TEST-INSTALL-PL.md
          cd dist
          sha256sum PlexConfigControl-test-image.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: PlexConfigControl-test-installation
          path: |
            dist/PlexConfigControl-test-image.tar.gz
            dist/TEST-INSTALL.md
            dist/TEST-INSTALL-PL.md
            dist/SHA256SUMS
          compression-level: 0
          retention-days: 30
