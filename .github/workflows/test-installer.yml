name: Build test installation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install '.[server]'
      - name: Run tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/browser/*.mjs
      - name: Build unprivileged test image
        run: docker build --tag plexconfigcontrol:test .
      - name: Test image over HTTPS and restart
        run: python tests/container_smoke.py
      - name: Install disposable browser-test tools
        run: |
          python -m pip install '.[browser-tests]'
          python -m playwright install --with-deps chromium firefox
          python -m playwright install msedge
      - name: Test real Chromium interface
        run: python tests/browser_e2e.py
      - name: Test real Firefox interface
        env:
          PCC_TEST_BROWSER: firefox
        run: python tests/browser_e2e.py
      - name: Test real Microsoft Edge interface
        env:
          PCC_TEST_BROWSER: msedge
        run: python tests/browser_e2e.py
      - name: Test confirmed execution dialogs in Chromium
        run: python tests/execution_ui_e2e.py
      - name: Test confirmed execution dialogs in Firefox
        env:
          PCC_TEST_BROWSER: firefox
        run: python tests/execution_ui_e2e.py
      - name: Test confirmed execution dialogs in Microsoft Edge
        env:
          PCC_TEST_BROWSER: msedge
        run: python tests/execution_ui_e2e.py
      - name: Test Android touch emulation
        run: python tests/mobile_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlexConfigControl-browser-screenshots
          path: dist/browser-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Package test installation
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p dist
          docker save plexconfigcontrol:test | gzip > dist/PlexConfigControl-test-image.tar.gz
          cp deploy/TEST-INSTALL.md dist/TEST-INSTALL.md
          cp deploy/TEST-INSTALL-PL.md dist/TEST-INSTALL-PL.md
          python - <<'PYINFO'
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          Path('dist/BUILD-INFO.txt').write_text(
              'PlexConfigControl — restricted test installation\n'
              + 'Source commit: ' + os.environ['GITHUB_SHA'] + '\n'
              + 'Built (UTC): ' + datetime.now(timezone.utc).isoformat() + '\n'
              + 'Backup/Restore execution and host mutations are disabled.\n'
              + 'Follow TEST-INSTALL-PL.md or TEST-INSTALL.md.\n', encoding='utf-8')
          PYINFO
          cd dist
          sha256sum PlexConfigControl-test-image.tar.gz TEST-INSTALL.md TEST-INSTALL-PL.md BUILD-INFO.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: PlexConfigControl-test-installation
          path: |
            dist/PlexConfigControl-test-image.tar.gz
            dist/TEST-INSTALL.md
            dist/TEST-INSTALL-PL.md
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          compression-level: 0
          retention-days: 30

  android-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Android browser-test dependencies
        run: python -m pip install '.[server,browser-tests]'
      - name: Build disposable test image
        run: docker build --tag plexconfigcontrol:test .
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Chrome inside Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: PCC_MOBILE_MODE=android PCC_ANDROID_EMULATOR_ONLY=1 python tests/mobile_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlexConfigControl-Android-browser-screenshots
          path: dist/browser-screenshots/android-system/
          if-no-files-found: ignore
          retention-days: 14

  apple-browsers:
    runs-on: macos-26
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        target: [firefox-macos, safari-macos, safari-ios, safari-ipados]
    env:
      PCC_APPLE_TARGET: ${{ matrix.target }}
      PCC_APPLE_CI_ONLY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Apple test dependencies
        run: python -m pip install '.[server,apple-tests]'
      - name: Enable Safari WebDriver on disposable runner
        if: matrix.target != 'firefox-macos'
        run: sudo safaridriver --enable
      - name: Test actual Apple-platform browser
        run: python tests/apple_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PlexConfigControl-${{ matrix.target }}-screenshots
          path: dist/browser-screenshots/${{ matrix.target }}/
          if-no-files-found: ignore
          retention-days: 14
