name: Build TrueNAS catalog candidate

on:
  push:
    branches: ['work/catalog-click']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: catalog-image
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'ykrisw/PlexConfigControl' && github.ref == 'refs/heads/work/catalog-click'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/ykrisw/plexconfigcontrol
      TAG: 1.0.10-catalog.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke-test dependencies
        run: python -m pip install '.[server]'
      - name: Build the unprivileged panel image
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label 'org.opencontainers.image.licenses=MIT' \
            --tag plexconfigcontrol:test .
      - name: Test catalog mode in a real container
        run: python tests/container_smoke.py --catalog
      - name: Publish tested image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag plexconfigcontrol:test "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"
          printf 'Published `%s`\n' "$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$TAG")" >> "$GITHUB_STEP_SUMMARY"
      - name: Check anonymous registry access
        run: |
          if docker manifest inspect "$IMAGE:$TAG" >/dev/null 2>&1; then
            echo 'The candidate manifest is publicly accessible.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::warning::The published package is not yet readable anonymously. Check package visibility in GitHub.'
            echo 'Package visibility must be checked before installation.' >> "$GITHUB_STEP_SUMMARY"
          fi
