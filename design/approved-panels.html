// Every tab shares the same content height at a given viewport width.
// Measure the full content of all five panels, without clipping or scrollbars.
function equalizePanels(){
  root.dataset.measuring='true';
  const selectedPage=page;
  main.style.height='auto';
  main.style.minHeight='0px';
  let commonHeight=684;
  for(const tab of tabs){page=tab;draw();commonHeight=Math.max(commonHeight,Math.ceil(main.getBoundingClientRect().height));}
  page=selectedPage;
  draw();
  main.style.minHeight=(commonHeight+100)+'px';
  main.style.height=(commonHeight+100)+'px';
  delete root.dataset.measuring;
}
equalizePanels();
let measuredWidth=root.getBoundingClientRect().width;
new ResizeObserver(()=>{
  const width=root.getBoundingClientRect().width;
  if(Math.abs(width-measuredWidth)>.5){measuredWidth=width;equalizePanels();}
}).observe(root);
if(document.fonts)document.fonts.ready.then(equalizePanels);
