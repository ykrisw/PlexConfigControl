[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plexconfigcontrol"
version = "0.1.0.dev0"
description = "Plex configuration backup and restore application for TrueNAS"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.9,<2"]

[project.optional-dependencies]
server = ["gunicorn==25.2.0", "cryptography==50.0.2", "tzdata>=2026.1"]

[tool.setuptools.packages.find]
include = ["plexconfigcontrol*"]

[tool.setuptools.package-data]
plexconfigcontrol = ["static/*.mjs", "static/*.css", "static/*.html"]
